onboarding = false
[keys]
prefix = "ctrl+a"
navigate_pane_left = "alt+left"
navigate_pane_right = "alt+right"
navigate_pane_up = "alt+up"
navigate_pane_down = "alt+down"

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = true

# $ctx and $trees are pushed by claude-config's scripts/statusline.sh via
# `herdr pane|workspace report-metadata` on every status-line tick, so the
# sidebar shows context usage per agent and treehouse pool pressure per repo
# without focusing a pane.
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", "$ctx"], ["terminal_title_stripped"], ["agent"]]

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"], ["$trees"]]

# Light theme to match WezTerm rose-pine-dawn (2026-10-15).
[theme]
name = "rose-pine-dawn"
